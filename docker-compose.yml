services:
  ds2api:
    build:
      context: .
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://host.docker.internal:7897}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,ds2api,axonhub}
        http_proxy: ${BUILD_http_proxy:-http://host.docker.internal:7897}
        https_proxy: ${BUILD_https_proxy:-http://host.docker.internal:7897}
        no_proxy: ${BUILD_no_proxy:-localhost,127.0.0.1,ds2api,axonhub}
    image: ghcr.io/cjackhwang/ds2api:latest
    container_name: ds2api
    restart: always
    env_file:
      - .env
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-6011}:5001"
    volumes:
      - ./config.json:/app/config.json    # 配置文件
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY:-ds2api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - axonhub-network

networks:
  axonhub-network:
    external: true
